<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Md Daud - Security Researcher & Engineer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #ffffff;
            color: #202124;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 80px 24px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        header {
            margin-bottom: 64px;
            animation: fadeInUp 0.8s ease-out;
        }

        h1 {
            font-size: 48px;
            font-weight: 400;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            color: #202124;
        }

        .subtitle {
            font-size: 20px;
            color: #5f6368;
            font-weight: 300;
            margin-bottom: 4px;
        }

        .role {
            font-size: 16px;
            color: #80868b;
            font-weight: 300;
        }

        .divider {
            width: 48px;
            height: 2px;
            background: #202124;
            margin: 48px 0;
            animation: expandWidth 0.8s ease-out 0.3s both;
        }

        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        .link-item {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #202124;
            font-size: 15px;
            padding: 12px 0;
            position: relative;
            transition: all 0.2s ease;
        }

        .link-item::after {
            content: '';
            position: absolute;
            bottom: 8px;
            left: 0;
            width: 0;
            height: 1px;
            background: #202124;
            transition: width 0.3s ease;
        }

        .link-item:hover::after {
            width: 100%;
        }

        .link-item:hover {
            transform: translateX(4px);
        }

        .icon {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        footer {
            margin-top: 80px;
            padding-top: 32px;
            border-top: 1px solid #e8eaed;
            text-align: center;
            color: #80868b;
            font-size: 14px;
            animation: fadeIn 1s ease-out 0.6s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes expandWidth {
            from {
                width: 0;
            }
            to {
                width: 48px;
            }
        }

        @media (max-width: 640px) {
            .container {
                padding: 48px 20px;
            }

            h1 {
                font-size: 36px;
            }

            .subtitle {
                font-size: 18px;
            }

            .links {
                flex-direction: column;
                gap: 16px;
            }
        }
    </style>
</head>
